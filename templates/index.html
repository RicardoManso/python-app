<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
        }

        .converter-card {
            border-radius: 24px;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 440px;
            width: 100%;
        }

        h2 {
            font-weight: 700;
            color: #302b63;
        }

        .form-label {
            font-weight: 600;
            color: #4a4a6a;
        }

        .form-control, .form-select {
            border-radius: 12px;
            border: 2px solid #e0e0ef;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c63ff, #3f3d9e);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
            background: linear-gradient(135deg, #5a52e0, #302b63);
        }

        .arrow-separator {
            font-size: 1.5rem;
            color: #6c63ff;
            font-weight: 700;
        }

        .result-box {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2ecc71;
            background: #f0fdf4;
            border-radius: 12px;
            padding: 12px;
        }

        .error-box {
            font-size: 1rem;
            font-weight: 600;
            color: #e74c3c;
            background: #fdf0f0;
            border-radius: 12px;
            padding: 12px;
        }

        @media (max-width: 480px) {
            .converter-card {
                margin: 16px;
                padding: 24px !important;
            }

            h2 {
                font-size: 1.4rem;
            }

            .result-box {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="card converter-card p-4 p-md-5">
        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" step="0.01" name="amount"
                       class="form-control form-control-lg"
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col">
                    <select name="from_currency" class="form-select form-select-lg">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
                <div class="col-auto text-center arrow-separator">
                    →
                </div>
                <div class="col">
                    <select name="to_currency" class="form-select form-select-lg">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box">
                {{ result }}
            </div>
        {% endif %}

        {% if error %}
            <div class="mt-4 text-center error-box">
                {{ error }}
            </div>
        {% endif %}
    </div>

</body>
</html>
